name: Manual Release (Major/Minor)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (e.g., 1.0.0) – update gradle.properties first'
        required: true
        type: string
      fromTag:
        description: 'Starting tag for changelog (e.g., v0.9.0). Leave empty to auto-detect the last release tag.'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew

      - name: Install git-cliff
        uses: orhun/git-cliff-action/setup@v4

      - name: Generate full changelog
        run: |
          FROM_TAG="${{ github.event.inputs.fromTag }}"
          if [ -z "$FROM_TAG" ]; then
            ./gradlew generateFullChangelog -PnewVersion=${{ github.event.inputs.version }}
          else
            ./gradlew generateFullChangelog -PfromTag=$FROM_TAG -PnewVersion=${{ github.event.inputs.version }}
          fi

      - name: Set version in gradle.properties
        run: |
          sed -i "s/^mod_version=.*/mod_version=${{ github.event.inputs.version }}/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: set version to ${{ github.event.inputs.version }} [skip ci]"
          git tag "v${{ github.event.inputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ github.event.inputs.version }}"

      - name: Set changelog env
        run: |
          echo "CHANGELOG<<EOF" >> "$GITHUB_ENV"
          cat CHANGELOG_RELEASE.md >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Build project
        run: ./gradlew build

      - name: Publish to GitHub
        run: ./gradlew publishMods
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}