name: Build Project.
on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'stonecutter.properties.toml'
      - 'buildSrc/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Project
        # Needed since tests are broken for no reason?
        # :26.2 is pinned for local work but its source is not 26.2-API-compatible yet,
        # so CI gates on the vcs/stable version (26.1) only.
        run: ./gradlew :26.1:build -x test