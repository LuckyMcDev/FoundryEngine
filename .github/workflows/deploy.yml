name: Deploy Docs

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'versions/**'
      - 'stonecutter.properties.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MC_VERSION: '26.2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Docusaurus
        working-directory: docs
        run: npm ci && npm run build

      - name: Build Javadoc
        run: ./gradlew ":${MC_VERSION}:javadoc"

      - name: Assemble site
        run: |
          mkdir -p final/javadoc
          cp -r docs/build/. final/
          cp -r versions/${MC_VERSION}/build/docs/javadoc/. final/javadoc/
          touch final/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: final
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v5