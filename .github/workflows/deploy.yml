name: Build & Deploy Docs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  vitepress:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'wiki:')
    uses: ./.github/workflows/build-vitepress.yml

  javadoc:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'wiki:')
    uses: ./.github/workflows/build-javadoc.yml

  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'wiki:')
    needs: [ vitepress, javadoc ]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: site

      - name: Merge artifacts
        run: |
          mkdir final
          cp -r site/vitepress/* final/
          mkdir -p final/javadoc
          cp -r site/javadoc/* final/javadoc/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: final

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
