name: Build & Deploy Docs

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - '.github/workflows/build-docusaurus.yml'
      - '.github/workflows/build-javadoc.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: ./.github/workflows/build-docusaurus.yml

  javadoc:
    uses: ./.github/workflows/build-javadoc.yml

  deploy:
    needs: [ docs, javadoc ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: site

      - name: Merge artifacts
        run: |
          mkdir final
          
          # Copy Docusaurus if it exists
          if [ -d "site/docusaurus" ]; then
            cp -r site/docusaurus/* final/
          fi
          
          # Copy Javadoc if it exists
          if [ -d "site/javadoc" ]; then
            mkdir -p final/javadoc
            cp -r site/javadoc/* final/javadoc/
          fi

      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final
          publish_branch: docs
          force_orphan: true