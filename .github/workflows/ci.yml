name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'gradle/**'
              - '*.gradle'
              - 'gradle.properties'
              - 'gradlew*'
            docs:
              - 'docs/**'
              - '.github/workflows/**'

  build-and-publish:
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    uses: ./.github/workflows/build-and-publish.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

  build-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/build-docs.yml
    secrets: inherit
    permissions:
      pages: write
      id-token: write