name: Build Javadoc

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Javadoc
        run: ./gradlew :26.1:javadoc :26.2:javadoc

      - name: Prepare Javadoc structure
        run: |
          mkdir -p javadoc_output/26.1 javadoc_output/26.2
          if [ -d "versions/26.1/build/docs/javadoc" ]; then
            cp -r versions/26.1/build/docs/javadoc/. javadoc_output/26.1/
          fi
          if [ -d "versions/26.2/build/docs/javadoc" ]; then
            cp -r versions/26.2/build/docs/javadoc/. javadoc_output/26.2/
          fi
          cat << 'EOF' > javadoc_output/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>FoundryEngine Javadoc</title>
            <meta http-equiv="refresh" content="0; url=26.1/">
            <link rel="canonical" href="26.1/">
          </head>
          <body>
            <h1>FoundryEngine Javadoc</h1>
            <p>Redirecting to <a href="26.1/">Minecraft 26.1 Javadoc</a>...</p>
            <ul>
              <li><a href="26.1/">Minecraft 26.1 Javadoc</a></li>
              <li><a href="26.2/">Minecraft 26.2 Javadoc</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: javadoc_output