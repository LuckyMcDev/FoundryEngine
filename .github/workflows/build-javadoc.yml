name: Build Javadoc

on:
  workflow_call:
    inputs:
      version:
        description: 'Minecraft version subproject for Javadoc generation'
        required: false
        default: '26.2'
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Minecraft version subproject for Javadoc generation'
        required: false
        default: '26.2'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate Javadoc
        run: ./gradlew :${{ inputs.version || '26.2' }}:javadoc

      - name: Upload Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: versions/${{ inputs.version || '26.2' }}/build/docs/javadoc