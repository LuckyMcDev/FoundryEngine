name: Bump Version
on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect bump type from commit
        id: detect-bump
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          BUMP_TYPE="${{ inputs.bump-type }}"
          
          # Override with commit message if it contains specific bump type
          if [[ "$MESSAGE" == *":major"* ]]; then
            BUMP_TYPE="major"
          elif [[ "$MESSAGE" == *":minor"* ]]; then
            BUMP_TYPE="minor"
          elif [[ "$MESSAGE" == *":patch"* ]]; then
            BUMP_TYPE="patch"
          fi
          
          echo "bump-type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Detected bump type: $BUMP_TYPE"

      - name: Bump version
        id: bump
        run: |
          # Read current version from gradle.properties
          CURRENT_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version components
          if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SUFFIX="${BASH_REMATCH[4]}"
          else
            echo "Error: Version format not recognized: $CURRENT_VERSION"
            exit 1
          fi
          
          # Bump based on type
          BUMP_TYPE="${{ steps.detect-bump.outputs.bump-type }}"
          case $BUMP_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          # Construct new version (preserve suffix if it exists)
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}${SUFFIX}"
          echo "New version: $NEW_VERSION"
          
          # Update gradle.properties
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties
          
          # Output for later steps
          echo "old-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add gradle.properties
          git commit -m "chore: bump version from ${{ steps.bump.outputs.old-version }} to ${{ steps.bump.outputs.new-version }}"
          git push

      - name: Create tag
        run: |
          git tag "v${{ steps.bump.outputs.new-version }}"
          git push origin "v${{ steps.bump.outputs.new-version }}"

      - name: Summary
        run: |
          echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Old Version:** ${{ steps.bump.outputs.old-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** ${{ steps.bump.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type:** ${{ steps.detect-bump.outputs.bump-type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created:** v${{ steps.bump.outputs.new-version }}" >> $GITHUB_STEP_SUMMARY