name: Build, Bump & Publish

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Project
        run: ./gradlew build

  bump-and-publish:
    needs: build
    runs-on: ubuntu-latest
    # Skip the bump commit's own push to avoid an infinite build loop
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Use a token (not the default GITHUB_TOKEN) if you need pushed commits
          # to re-trigger other workflows. The default token works fine for this
          # pipeline since the bump commit itself is skipped above.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bump patch version
        run: ./gradlew bumpVersion

      - name: Read bumped version
        id: version
        run: echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build changelog from commit message
        run: |
          {
            echo "CHANGELOG<<EOF"
            git log -1 --skip=1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Re-run build with bumped version
        run: ./gradlew build

      - name: Publish to GitHub
        run: ./gradlew publishMods
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}