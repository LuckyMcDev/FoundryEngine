plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named("${mod_id}")
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    def jarJarApiImpl = { String gav -> jarJar(api(implementation(gav))) }

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testImplementation "net.neoforged:testframework:${project.neo_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    jarJar(implementation("org.xerial:sqlite-jdbc:${project.sqlite_version}"))
    jarJar(implementation("com.j256:ormlite:${project.ormlite_version}"))

    jarJarApiImpl("org.apache.groovy:groovy:${project.groovy_version}")

    jarJar(implementation(platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")))
    
    def lwjglModules = ["lwjgl", "lwjgl-meshoptimizer", "lwjgl-opencl", "lwjgl-par", "lwjgl-shaderc"]
    lwjglModules.each { module ->
        jarJarApiImpl("org.lwjgl:${module}:${project.lwjgl_version}")
    }

    def lwjglNativePlatforms = ["natives-windows", "natives-linux", "natives-macos"]
    lwjglNativePlatforms.each { platform ->
        ["lwjgl", "lwjgl-meshoptimizer", "lwjgl-par", "lwjgl-shaderc"].each { module ->
            jarJar(runtimeOnly("org.lwjgl:${module}::${platform}"))
        }
    }

    jarJarApiImpl("io.github.spair:imgui-java-binding:${project.imgui_version}")
    jarJar(api(implementation("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}"))) {
        exclude group: "org.lwjgl"
    }
    def imguiNativeArtifacts = ["imgui-java-natives-windows", "imgui-java-natives-linux", "imgui-java-natives-macos"]
    imguiNativeArtifacts.each { artifact ->
        jarJarApiImpl("io.github.spair:${artifact}:${project.imgui_version}")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts") {
    dependsOn(generateModMetadata)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("${projectDir}/repo").toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
