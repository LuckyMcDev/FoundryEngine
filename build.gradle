plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id "fe-neoforge"
	id "fe-publishing"
	id "fe-tasks"
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    gradlePluginPortal()
    mavenCentral()
    maven {
        name "Neoforge"
        url "https://maven.neoforged.net/releases"
    }
    maven {
        name "Latvian"
        url "https://maven.latvian.dev/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

test {
    useJUnitPlatform()
}

idea {
    module {
        downloadJavadoc = true
	    excludeDirs.add(file(".editorconfig"))
    }
}

apply from: 'dependencies.gradle'