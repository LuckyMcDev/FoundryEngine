plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named("${mod_id}")
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
    testImplementation "net.neoforged:testframework:${project.neo_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    jarJar(implementation("org.xerial:sqlite-jdbc:${project.sqlite_version}"))
    jarJar(implementation("com.j256:ormlite:${project.ormlite_version}"))

    jarJar(implementation(platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")))

    jarJar(api(implementation("org.lwjgl:lwjgl:${project.lwjgl_version}")))
    jarJar(api(implementation("org.lwjgl:lwjgl-meshoptimizer:${project.lwjgl_version}")))
    jarJar(api(implementation( "org.lwjgl:lwjgl-opencl:${project.lwjgl_version}")))
    jarJar(api(implementation( "org.lwjgl:lwjgl-par:${project.lwjgl_version}")))
    jarJar(api(implementation( "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}")))

    // 3. Add the natives (using the BOM version)
    def lwjglNatives = ["natives-windows", "natives-linux", "natives-macos"]
    lwjglNatives.each { platform ->
        jarJar(runtimeOnly "org.lwjgl:lwjgl::$platform")
        jarJar(runtimeOnly "org.lwjgl:lwjgl-meshoptimizer::$platform")
        jarJar(runtimeOnly "org.lwjgl:lwjgl-par::$platform")
        jarJar(runtimeOnly "org.lwjgl:lwjgl-shaderc::$platform")
    }


    jarJar(api(implementation(("io.github.spair:imgui-java-binding:${project.imgui_version}"))))
    jarJar(api(implementation(("io.github.spair:imgui-java-lwjgl3:${project.imgui_version}")))) {
        exclude group: "org.lwjgl"
    }

    jarJar(api(implementation(("io.github.spair:imgui-java-natives-windows:${project.imgui_version}"))))
    jarJar(api(implementation(("io.github.spair:imgui-java-natives-linux:${project.imgui_version}"))))
    jarJar(api(implementation(("io.github.spair:imgui-java-natives-macos:${project.imgui_version}"))))

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts") {
    dependsOn(generateModMetadata)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("${projectDir}/repo").toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
