import org.jetbrains.dokka.gradle.engine.parameters.VisibilityModifier

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'org.jetbrains.dokka' version "2.1.0"
    id 'org.jetbrains.dokka-javadoc' version "2.1.0"
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://keksuccino.github.io/maven/" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            systemProperty 'terminal.ansi', 'true'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named("${mod_id}")
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Testing dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation "net.neoforged:testframework:${neo_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

dependencies {
    compileOnly "de.keksuccino:mcef-neoforge:${mcef_version}-${minecraft_version}"
}

dependencies {
    def jarJarApiImpl = { String gav -> jarJar(api(implementation(gav))) }

    jarJarApiImpl "org.commonmark:commonmark:${commonmark_version}"
    jarJarApiImpl "org.commonmark:commonmark-ext-gfm-tables:${commonmark_version}"
    jarJarApiImpl "org.commonmark:commonmark-ext-gfm-strikethrough:${commonmark_version}"
    jarJarApiImpl "org.commonmark:commonmark-ext-autolink:${commonmark_version}"
}

dependencies {
    // SQLite and ORMLite
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqlite_version}"))
    jarJar(implementation("com.j256:ormlite:${ormlite_version}"))
}

dependencies {
    def jarJarApiImpl = { String gav -> jarJar(api(implementation(gav))) }

    // Groovy
    jarJarApiImpl("org.apache.groovy:groovy:${groovy_version}")
}

dependencies {
    def jarJarApiImpl = { String dep -> jarJar(api(implementation(dep))) }

    // ImGui dependencies
    jarJarApiImpl("io.github.spair:imgui-java-binding:${imgui_version}")
    jarJar(api(implementation("io.github.spair:imgui-java-lwjgl3:${imgui_version}"))) {
        exclude group: "org.lwjgl"
        exclude group: 'org.lwjgl.lwjgl'
    }

    def imguiNativeArtifacts = ["imgui-java-natives-windows", "imgui-java-natives-linux", "imgui-java-natives-macos"]
    imguiNativeArtifacts.each { artifact ->
        jarJarApiImpl("io.github.spair:${artifact}:${imgui_version}")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts") {
    dependsOn(generateModMetadata)
}

tasks.register('preCommit') {
    group = 'verification'
    description = 'Runs all things needed for a commit.'

    dependsOn tasks.named('check')
    dependsOn tasks.named('runData')
    dependsOn tasks.named('build')

    doLast {
        println "Done"
    }
}

tasks.register('copyExampleBundles', Copy) {
    group = 'foundryengine'
    description = 'Copys the Example Bundles to the run directory for testing.'

    from 'ExampleBundles'
    into 'run/FoundryEngine/bundles'
}

// To generate documentation in HTML
tasks.register('dokkaHtmlJar', Jar) {
    description = 'A HTML Documentation JAR containing Dokka HTML'
    from(tasks.named('dokkaGeneratePublicationHtml').flatMap { it.outputDirectory })
    archiveClassifier.set('html-doc')
}

// To generate documentation in Javadoc
tasks.register('dokkaJavadocJar', Jar) {
    description = 'A Javadoc JAR containing Dokka Javadoc'
    from(tasks.named('dokkaGeneratePublicationJavadoc').flatMap { it.outputDirectory })
    archiveClassifier.set('javadoc')
}


dokka {

    dokkaPublications {
        html {
            outputDirectory.set(file("docs/generated/html"))
        }
        javadoc {
            outputDirectory.set(file("docs/generated/javadoc"))
        }
    }

    dokkaSourceSets.configureEach {

        displayName.set("FoundryEngine")
        moduleVersion.set(mod_version.toString())

        documentedVisibilities.set([
                VisibilityModifier.Public,
                VisibilityModifier.Protected
        ] as Set)

        reportUndocumented.set(false)

        skipEmptyPackages.set(true)
        skipDeprecated.set(false)

        jdkVersion.set(21)

        sourceLink {
            localDirectory.set(file("src/main/java"))
            remoteUrl.set(new URI("https://github.com/LuckyMcDev/FoundryEngine"))
            remoteLineSuffix.set("#L")
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("${projectDir}/repo").toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
