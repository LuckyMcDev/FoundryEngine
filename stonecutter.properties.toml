# Shared mod metadata. Version-specific values live in the per-version tables.
mod.id = "foundryengine"
mod.name = "Foundry Engine"
mod.group = "de.luckymcdev"
mod.version = "0.1.6"
mod.license = "All Rights Reserved"
mod.authors = "LuckyMcDev"
mod.description = "A Mod that turns Minecraft into a Game Engine."
mod.logo = "assets/foundryengine/textures/logo_transparent.png"
mod.credits = "Silhouette of cog icon from https://game-icons.net/ modified by Auseawesome. Originally licensed under CC-BY-3.0, full text available at https://creativecommons.org/licenses/by/3.0/"
mod.github = "LuckyMcDev/FoundryEngine"
mod.github_commitish = "master"

# Library versions shared across all Minecraft versions.
lib.imgui = "1.92.7.1"
lib.commonmark = "0.27.1"
lib.groovy = "5.0.4"
lib.renderdoc = "1.0.1-build.2"
lib.taffy = "1.1.4"
lib.jlayer = "1.0.1.4"
lib.jflac = "1.5.2"
lib.junit = "5.7.1"
lib.junit_platform = "1.7.1"
lib.sodium = "UETw0GTI"
lib.iris = "BO8hxvMR"

["26.1"]
# Minecraft version to compile against.
mod.mc = "26.1.2"
# Compatibility range written into neoforge.mods.toml and used for publishing.
mod.mc_compat = "[26.1.1,26.2)"
mod.mc_releases = ["26.1.2"]
deps.neo_loader = "26.1.2.93"
mod.neo_range = "[26.1.2.71,26.2)"
mod.loader_range = "[4,)"
# JEI artifacts are versioned per Minecraft version.
deps.jei = "29.5.0.28"

["26.2"]
mod.mc = "26.2"
mod.mc_compat = "[26.2,26.3)"
mod.mc_releases = ["26.2"]
