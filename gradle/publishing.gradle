javadoc {
    options {
        encoding = 'UTF-8'
        memberLevel = JavadocMemberLevel.PROTECTED
        author = false
        version = true
        windowTitle = "FoundryEngine ${mod_version}"
        docTitle = "FoundryEngine ${mod_version}"
        links 'https://docs.oracle.com/en/java/javase/21/docs/api/'
        //stylesheetFile = file("docs/javadoc/custom.css")
    }

    source = sourceSets.main.allJava
    exclude '**/internal/**'

    failOnError = false
}

tasks.register('javadocJar', Jar) {
    description = 'A Javadoc JAR built with the standard Javadoc tool'
    group = "documentation"
    dependsOn javadoc
    from javadoc.destinationDir
    archiveClassifier.set('javadoc')
}

publishMods {
    changelog = providers.environmentVariable("CHANGELOG").orElse("No changelog provided.")
    type = ALPHA
    modLoaders.add("neoforge")

    version = mod_version
    displayName = "${mod_name} ${mod_version}"

    file = jar.archiveFile
    additionalFiles.from(javadocJar.archiveFile)

    // dryRun = true

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "LuckyMcDev/FoundryEngine"
        commitish = "master"
        tagName = "v${mod_version}"
    }
}

// Publishing configuration
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact javadocJar
        }
    }
    repositories {
        maven {
            name = "Local"
            url = file("${projectDir}/repo").toURI()
        }
    }
}