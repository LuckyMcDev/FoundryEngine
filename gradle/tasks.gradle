// Pre-commit verification task
tasks.register('preCommit') {
    group = 'foundryengine'
    description = 'Runs all things needed for a commit.'

    dependsOn tasks.named('check')
    dependsOn tasks.named('runData')
    dependsOn tasks.named('build')

    doLast {
        println "Done"
    }
}

def sourceDirs = sourceSets.main.java.srcDirs.findAll { it.directory }

tasks.register('generatePackageInfo') {
    group = 'foundryengine'
    description = 'Generates missing package-info.java files for all Java source directories.'

    doLast {
        sourceDirs.each { srcDir ->
            def srcPath = srcDir.toPath()

            def dirs = []
            srcDir.eachDirRecurse { dirs << it }

            dirs.each { dir ->
                if (!dir.listFiles()?.any { it.name.endsWith('.java') }) return

                def pkgFile = new File(dir, 'package-info.java')
                if (pkgFile.exists()) return

                def pkg = srcPath.relativize(dir.toPath()).toString()
                        .replace(File.separator, '.')
                def segments = pkg.split('\\.') as List
                def foundryIdx = segments.indexOf('foundryengine')
                def relevant = foundryIdx >= 0 ? segments.drop(foundryIdx + 1) : segments
                def desc = relevant.isEmpty() ? pkg : relevant.collect { seg ->
                    seg.replaceAll(/([a-z])([A-Z])/, '$1 $2')
                       .split(' ')
                       .collect { it.capitalize() }
                       .join(' ')
                }.join(' - ')

                pkgFile.text = """\
/**
 * ${desc}
 */
@NullMarked
package ${pkg};

import org.jspecify.annotations.NullMarked;
"""
                logger.lifecycle("Generated: {}", pkgFile)
            }
        }
    }
}

tasks.register("copyExampleBundles") {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the run directories for testing.'

    dependsOn tasks.named('copyExampleBundlesToServer')
    dependsOn tasks.named('copyExampleBundlesToClient')
    dependsOn tasks.named('copyExampleBundlesToGameTestServer')
}

tasks.register("copyExampleBundlesToServer", Copy) {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the server run directory for testing.'

    from 'ExampleBundles'

    into('runs/server/FoundryEngine/bundles')
}

tasks.register("copyExampleBundlesToGameTestServer", Copy) {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the server run directory for testing.'

    from 'ExampleBundles'

    into('runs/gameTestServer/FoundryEngine/bundles')
}

tasks.register("copyExampleBundlesToClient", Copy) {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the client run directory for testing.'

    from 'ExampleBundles'

    into('runs/client/FoundryEngine/bundles')
}
