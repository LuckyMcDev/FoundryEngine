// Bumps the patch segment of mod_version in gradle.properties (x.y.z -> x.y.(z+1))
tasks.register('bumpVersion') {
    group = 'foundryengine'
    description = 'Bumps the patch version in gradle.properties and writes the new version to GITHUB_OUTPUT/GITHUB_ENV if running in CI.'

    // Resolve everything Project-related at configuration time so the
    // action below only touches plain Java/Groovy objects (config-cache safe).
    def propsFile = file('gradle.properties')
    def currentVersion = mod_version as String
    def githubOutputPath = System.getenv('GITHUB_OUTPUT')
    def githubEnvPath = System.getenv('GITHUB_ENV')

    doLast {
        def lines = propsFile.readLines()

        def parts = currentVersion.split('\\.')
        if (parts.length != 3) {
            throw new GradleException("mod_version '${currentVersion}' is not in x.y.z format, cannot bump")
        }

        def newPatch = (parts[2] as Integer) + 1
        def newVersion = "${parts[0]}.${parts[1]}.${newPatch}"

        def newLines = lines.collect { line ->
            line.startsWith('mod_version=') ? "mod_version=${newVersion}" : line
        }

        propsFile.text = newLines.join('\n') + '\n'

        println "Bumped mod_version: ${currentVersion} -> ${newVersion}"

        if (githubOutputPath) {
            new File(githubOutputPath).append("new_version=${newVersion}\n")
        }

        if (githubEnvPath) {
            new File(githubEnvPath).append("NEW_VERSION=${newVersion}\n")
        }
    }
}

tasks.register('generateFullChangelog') {
    group = 'foundryengine'
    description = 'Generates a full changelog from the last release tag (or a given tag) to HEAD.'

    doLast {
        def tag = project.hasProperty('fromTag') ? project.fromTag : null
        if (tag == null) {
            // Auto-detect the last tag that is NOT a patch (i.e., ends with .0, or use a regex)
            // For simplicity, we'll just get the previous tag that does not have a patch segment > 0.
            def allTags = "git tag -l 'v*' --sort=-v:refname".execute().text.trim().split('\n')
            def releaseTags = allTags.findAll { tagName ->
                // Assume patch tags are like v0.0.65, release tags like v1.0.0 or v0.1.0
                // We'll treat tags ending with .0 as release tags (major/minor)
                tagName =~ /v\d+\.\d+\.0$/
            }
            if (releaseTags.isEmpty()) {
                throw new GradleException("No previous release tag found.")
            }
            tag = releaseTags[0] // newest release tag
        }

        // Run git-cliff to generate changelog from that tag to HEAD
        def changelogFile = file("CHANGELOG_RELEASE.md")
        def cmd = "git-cliff ${tag}..HEAD -o ${changelogFile.absolutePath} --config cliff.toml"
        def process = cmd.execute()
        process.waitFor()
        if (process.exitValue() != 0) {
            throw new GradleException("git-cliff failed: ${process.err.text}")
        }

        println "Changelog generated in ${changelogFile.absolutePath}"
        // Optionally prepend the new version title
        if (project.hasProperty('newVersion')) {
            def version = project.newVersion
            def content = changelogFile.text
            changelogFile.text = "# Version ${version}\n${content}"
        }
    }
}

// Pre-commit verification task
tasks.register('preCommit') {
    group = 'foundryengine'
    description = 'Runs all things needed for a commit.'

    dependsOn tasks.named('check')
    dependsOn tasks.named('runData')
    dependsOn tasks.named('build')

    doLast {
        println "Done"
    }
}

def sourceDirs = sourceSets.main.java.srcDirs.findAll { it.directory }

tasks.register('generatePackageInfo') {
    group = 'foundryengine'
    description = 'Generates missing package-info.java files for all Java source directories.'

    doLast {
        sourceDirs.each { srcDir ->
            def srcPath = srcDir.toPath()

            def dirs = []
            srcDir.eachDirRecurse { dirs << it }

            dirs.each { dir ->
                if (!dir.listFiles()?.any { it.name.endsWith('.java') }) return

                def pkgFile = new File(dir, 'package-info.java')
                if (pkgFile.exists()) return

                def pkg = srcPath.relativize(dir.toPath()).toString()
                        .replace(File.separator, '.')
                def segments = pkg.split('\\.') as List
                def foundryIdx = segments.indexOf('foundryengine')
                def relevant = foundryIdx >= 0 ? segments.drop(foundryIdx + 1) : segments
                def desc = relevant.isEmpty() ? pkg : relevant.collect { seg ->
                    seg.replaceAll(/([a-z])([A-Z])/, '$1 $2')
                            .split(' ')
                            .collect { it.capitalize() }
                            .join(' ')
                }.join(' - ')

                pkgFile.text = """\
/**
 * ${desc}
 */
@NullMarked
package ${pkg};

import org.jspecify.annotations.NullMarked;
"""
                logger.lifecycle("Generated: {}", pkgFile)
            }
        }
    }
}

tasks.register("copyExampleBundles") {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the run directories for testing.'

    dependsOn tasks.named('copyExampleBundlesToServer')
    dependsOn tasks.named('copyExampleBundlesToClient')
    dependsOn tasks.named('copyExampleBundlesToGameTestServer')
}

tasks.register("copyExampleBundlesToServer", Copy) {
    group = 'foundryengine'
    description = 'Copies the Example Bundles to the server run directory for testing.'

    from 'ExampleBundles'

    into('runs/server/FoundryEngine/bundles')
}

